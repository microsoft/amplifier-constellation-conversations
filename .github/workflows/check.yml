name: Check and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/voice.mjs
      - run: cargo build --locked
      - run: npm ci && npx playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 tests/browser.py
        if: matrix.os == 'ubuntu-24.04'
      - run: BROWSER_STEERING=1 python3 tests/browser.py
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo build --locked --release
      - name: Package the checked executable
        run: |
          mkdir -p dist
          cp target/release/agent-conversations dist/
          cd dist
          sha256sum agent-conversations > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agent-conversations-${{ matrix.os }}
          path: dist/*
