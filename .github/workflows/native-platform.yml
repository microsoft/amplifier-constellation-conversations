name: Native packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'src/**'
      - 'bridge/**'
      - 'scripts/*native*'
      - 'scripts/vendor/node/**'
      - 'scripts/vendor/node-provenance.json'
      - 'scripts/vendor/node-LICENSE'
      - 'ops/companion.example.json'
      - 'ops/pam-agent-conversations'
      - 'docs/native-*.md'
      - 'tests/*native*'
      - 'tests/native/**'
      - '.github/workflows/native-platform.yml'

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target }} native package and clean-path install
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            architecture: x64
            rust_target: x86_64-unknown-linux-gnu
            suffix: ''
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            architecture: arm64
            rust_target: aarch64-unknown-linux-gnu
            suffix: ''
          - runner: macos-15-intel
            target: macos-x64
            architecture: x64
            rust_target: x86_64-apple-darwin
            suffix: ''
          - runner: macos-15
            target: macos-arm64
            architecture: arm64
            rust_target: aarch64-apple-darwin
            suffix: ''
          # This is native x64 Windows Server build/launch coverage. A separate
          # Windows 11 x64 consumer-machine receipt is still required.
          - runner: windows-2025
            target: windows-x64
            architecture: x64
            rust_target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - runner: windows-11-arm
            target: windows-arm64
            architecture: arm64
            rust_target: aarch64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.runner }}
    # Native builds plus multiple whole-bundle/OS-startup rollback transactions
    # need a separate CI wall clock. Participant prepare/restore still use 30s,
    # and verification 300s; no application or agent-work allowance is extended.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      # Target-specific, so host proc macros/build scripts retain their own CRT.
      # Inspect the finished imports too; the compiler flag alone is not proof.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies only
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          architecture: ${{ matrix.architecture }}
      - name: Build the native executable and run platform unit tests
        run: |
          python scripts/run-native-rust-tests.py --target '${{ matrix.rust_target }}' --output '${{ runner.temp }}/native-rust-tests.json'
          cargo test --locked --target '${{ matrix.rust_target }}' --test native_update_bundle --test native_update_admission
          cargo build --locked --target '${{ matrix.rust_target }}' --release
      - name: Acquire locked build-time dependencies
        run: |
          npm ci --ignore-scripts --omit=dev --prefix bridge
          npm ci --ignore-scripts --prefix tests/native
          python scripts/native-ci-inputs.py --target '${{ matrix.target }}' --service 'target/${{ matrix.rust_target }}/release/agent-conversations${{ matrix.suffix }}' --output '${{ runner.temp }}/native-inputs'
      - name: Inspect native Windows DLL dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r scripts/native-build-requirements.txt
          python scripts/check-native-imports.py --inputs '${{ runner.temp }}/native-inputs/inputs.json' --output '${{ runner.temp }}/native-inputs/pe-imports.json'
      - name: Check package validation regressions
        run: |
          python -m unittest discover -s tests -p 'test_*native*.py'
          python scripts/vendor/node/test_support.py
      - name: Assemble self-contained immutable bundle
        run: python scripts/package-native.py build --inputs '${{ runner.temp }}/native-inputs/inputs.json' --output dist
      - name: Install and launch with developer tools absent from child PATH
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('clean_install', 'tests/native_clean_install.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipts = list(Path('dist').glob('conversations-*.json'))
          assert len(receipts) == 1, 'Expected one immutable package receipt'
          import json
          receipt = json.loads(receipts[0].read_text())
          module.qualify((Path('dist') / receipt['archive']).resolve(), receipts[0].resolve(), Path('dist/clean-path-install.json').resolve())
          PY
      - name: Verify standalone and enrolled whole-bundle update and rollback
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native_update_lifecycle', 'tests/native_update_lifecycle.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipts = list(Path('dist').glob('conversations-*.json'))
          assert len(receipts) == 1, 'Expected one immutable package receipt'
          receipt = json.loads(receipts[0].read_text(encoding='utf-8'))
          module.qualify((Path('dist') / receipt['archive']).resolve(), receipts[0].resolve(), Path('dist/native-update-lifecycle.json').resolve())
          PY
      - name: Prepare disposable Linux current-user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Register, start, verify, stop and remove disposable native startup
        env:
          CONSTELLATION_NATIVE_STARTUP_TEST: '1'
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native_startup', 'scripts/test-native-startup.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipts = list(Path('dist').glob('conversations-*.json'))
          assert len(receipts) == 1, 'Expected one immutable package receipt'
          receipt = json.loads(receipts[0].read_text(encoding='utf-8'))
          result = module.qualify((Path('dist') / receipt['archive']).resolve(), receipts[0].resolve(), Path('dist/native-startup.json').resolve())
          assert result['status'] == 'passed', 'Unavailable startup manager is not a passing qualification'
          PY
      - name: Test minimal Ubuntu userland without installed developer tools
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import importlib.util, json, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('clean_userland', 'tests/native_clean_userland.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipts = list(Path('dist').glob('conversations-*.json'))
          assert len(receipts) == 1, 'Expected one immutable package receipt'
          receipt = json.loads(receipts[0].read_text())
          subprocess.run(['docker', 'pull', '--platform', module.PLATFORMS[receipt['target']][0], module.IMAGE], check=True)
          result = module.qualify((Path('dist') / receipt['archive']).resolve(), receipts[0].resolve(), Path('dist/clean-userland.json').resolve())
          assert result['status'] == 'passed', 'Inspect retained clean-userland receipt'
          PY
      - name: Retain exact build and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversations-native-${{ matrix.target }}
          path: |
            dist/*
            ${{ runner.temp }}/native-inputs/node-provenance.json
            ${{ runner.temp }}/native-inputs/native-build-provenance.json
            ${{ runner.temp }}/native-inputs/pe-imports.json
            ${{ runner.temp }}/native-rust-tests.json
          if-no-files-found: warn
          retention-days: 7

# These lanes use native hosted runners; Linux additionally exercises an isolated
# Ubuntu userland with no developer tools installed. They do not install onto a newly
# provisioned consumer machine, enroll OS certificate trust, test an OS password,
# or exercise a real sign-out/sign-in cycle. The separate startup step uses one
# UUID-named registration on the disposable runner account, not an existing user
# desktop. These lanes do not exercise physical microphone/camera, sign, publish or
# adopt a package on any existing installation. In particular this workflow does
# not resume the separately paused speech release.
