[package]
name = "agent-conversations"
version = "0.12.8"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-constellation-conversations"
description = "Browser conversations, people and agents, threads, approvals, and source context."

[dependencies]
amplifier-acp-connection = { git = "https://github.com/microsoft/amplifier-constellation", rev = "fd95c20a5773a739c8a1c99fb69713a2f0849bf3" }
amplifier-native-platform = { git = "https://github.com/microsoft/amplifier-constellation", rev = "02b79049e7da9e393463363782e07b89431f8617", features = ["local-auth", "installation"] }
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
dunce = "1"
futures-util = "0.3"
fs2 = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
if-addrs = { version = "0.15", features = ["link-local"] }
libc = "0.2"
rand = "0.8"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
pam-client = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
